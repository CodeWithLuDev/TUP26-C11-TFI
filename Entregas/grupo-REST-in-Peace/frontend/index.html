<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fixture interactivo del Mundial con posiciones, bracket y estadisticas en tiempo real."
    />
    <title>FIFA World Cup Qatar 2022</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Saira+Condensed:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pitch: {
                50: 'rgb(var(--color-pitch-50) / <alpha-value>)',
                100: 'rgb(var(--color-pitch-100) / <alpha-value>)',
                500: 'rgb(var(--color-pitch-500) / <alpha-value>)',
                600: 'rgb(var(--color-pitch-600) / <alpha-value>)',
                700: 'rgb(var(--color-pitch-700) / <alpha-value>)',
                900: 'rgb(var(--color-pitch-900) / <alpha-value>)',
                950: 'rgb(var(--color-pitch-950) / <alpha-value>)',
              },
              emerald: {
                50: 'rgb(var(--color-muted-50) / <alpha-value>)',
                100: 'rgb(var(--color-muted-100) / <alpha-value>)',
                300: 'rgb(var(--color-accent-300) / <alpha-value>)',
                400: 'rgb(var(--color-accent-400) / <alpha-value>)',
                500: 'rgb(var(--color-accent-500) / <alpha-value>)',
              },
              sand: 'rgb(var(--color-sand) / <alpha-value>)',
              pearl: 'rgb(var(--color-pearl) / <alpha-value>)',
              burgundy: 'rgb(var(--color-burgundy) / <alpha-value>)',
              gold: 'rgb(var(--color-gold) / <alpha-value>)',
              trophy: 'rgb(var(--color-trophy) / <alpha-value>)',
            },
            boxShadow: {
              glow: '0 24px 90px rgba(138, 21, 56, 0.34)',
              card: '0 22px 70px rgba(27, 3, 11, 0.42)',
              bracket: '0 18px 46px rgba(19, 3, 9, 0.34)',
            },
            fontFamily: {
              sans: ['Rajdhani', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'sans-serif'],
              display: ['Saira Condensed', 'Rajdhani', 'ui-sans-serif', 'system-ui'],
            },
          },
        },
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
